{% extends "base/base.html" %}
{% block page_title %}Enrol Student{% endblock %}
{% block nav %}
<a href="{% url 'academics:students' %}" class="nav-link">Students</a>
<a href="{% url 'academics:student_enrol' %}" class="nav-link active">Enrol</a>
{% endblock %}
{% block content %}
<form method="post" class="card stack">
  {% csrf_token %}
  <div class="grid two">
    <label>First name <input class="input" name="first_name" required></label>
    <label>Last name <input class="input" name="last_name" required></label>
  </div>
  <label>Other names <input class="input" name="other_names"></label>
  <div class="grid two">
    <label>Admission no (auto if blank) <input class="input" name="admission_no"></label>
    <label>Gender
      <select class="input" name="gender">
        <option value="">—</option>
        <option value="MALE">Male</option>
        <option value="FEMALE">Female</option>
      </select>
    </label>
  </div>
  <label>Class
    <select class="input" name="class_id">
      <option value="">—</option>
      {% for c in classes %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
    </select>
  </label>
  <button class="btn btn-primary" type="submit">Enrol</button>
</form>
{% endblock %}
